<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fake User</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      color: #222;
      background: #f8f9fc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #2c3e50;
    }
    .badge-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #aaa;
      margin-left: auto;
    }
    .badge-dot.active { background: #27ae60; }
    .badge-dot.error  { background: #e74c3c; }

    .section {
      background: #fff;
      border: 1px solid #e0e5ec;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #3b5998; box-shadow: 0 0 0 2px rgba(59,89,152,.12); }

    button {
      padding: 7px 14px;
      background: #3b5998;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background .15s;
      white-space: nowrap;
    }
    button:hover { background: #2d4373; }
    button:active { opacity: .82; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.danger { background: #e74c3c; }
    button.danger:hover { background: #c0392b; }

    .status {
      font-size: 12px;
      color: #666;
      min-height: 18px;
      padding: 4px 0;
    }
    .status .label { color: #888; }
    .status .value { color: #222; font-weight: 600; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .toggle-row label { font-size: 12px; font-weight: 500; color: #444; cursor: pointer; }

    /* Switch */
    .switch { position: relative; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc; border-radius: 20px; transition: .2s;
    }
    .slider::before {
      content: ''; position: absolute; height: 14px; width: 14px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    .switch input:checked + .slider { background: #3b5998; }
    .switch input:checked + .slider::before { transform: translateX(16px); }

    .info {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 4px;
    }
    .info a { color: #3b5998; text-decoration: none; }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #f0f4ff;
      border-radius: 6px;
      margin-top: 8px;
    }
    .user-card .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #3b5998;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .user-card .info-text { flex: 1; }
    .user-card .info-text .handle { font-weight: 600; color: #222; }
    .user-card .info-text .rating { font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Fake User</h2>
    <span class="badge-dot" id="statusDot"></span>
  </div>

  <div class="section">
    <div class="section-title">Target</div>
    <div class="row">
      <input type="text" id="handleInput" placeholder="CF handle e.g. tourist" spellcheck="false">
      <button id="setBtn">Set</button>
    </div>
    <div class="toggle-row">
      <label for="enabledToggle">Enable fake user</label>
      <label class="switch">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Status</div>
    <div class="status" id="statusMsg">
      <span class="label">No target set</span>
    </div>
    <div id="userCard" class="user-card" style="display:none;">
      <div class="avatar" id="userAvatar">?</div>
      <div class="info-text">
        <div class="handle" id="userHandle">—</div>
        <div class="rating" id="userRating">—</div>
      </div>
    </div>
  </div>

  <div class="info">
    Visual only &middot; you stay logged in as yourself<br>
    Works on <a href="https://codeforces.com" target="_blank">codeforces.com</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
